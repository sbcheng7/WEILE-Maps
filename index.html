<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>唯樂之丘・社區特約與桃園市民卡雙享生活地圖</title>
    <!-- 預先建立連線以加速 Maps 與字體載入 -->
    <link rel="preconnect" href="https://maps.googleapis.com">
    <link rel="preconnect" href="https://maps.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* 零外部 CSS 依賴，急速載入純 CSS */
        *, ::before, ::after {
            box-sizing: border-box;
            border-width: 0;
            border-style: solid;
            border-color: #334155;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            margin: 0;
            height: 100vh;
            height: 100dvh; /* 動態視口高度，避開 iOS/Android 底部導航列擠壓 */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ⭐ 智慧懸浮 / 釘選資訊卡 (支援桌面 Hover 跟隨與手機 Bottom Sheet 抽屜) */
        #floatingCard {
            display: none;
            position: absolute;
            z-index: 60;
            transition: opacity 0.15s ease-out;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 14px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            padding: 13px 15px;
            width: 340px;
            max-width: 90vw;
            max-height: calc(100% - 30px);
            overflow-y: auto;
            overflow-x: hidden;
            box-sizing: border-box;
            pointer-events: none;
            user-select: text;
        }

        #floatingCard.pinned {
            pointer-events: auto !important;
            border-color: #38bdf8;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.92), 0 0 15px rgba(56, 189, 248, 0.25);
        }

        /* 唯樂蜜蜂頭像框 */
        .bee-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #f59e0b;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .bee-avatar img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        /* 頂部按鈕圓形頭像框 (仿照左上角蜜蜂頭像風格，白底加精緻外框) */
        .header-btn-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffffff;
            border: 1.5px solid #64748b;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            vertical-align: middle;
        }
        .header-btn-avatar.amber {
            border-color: #f59e0b;
            box-shadow: 0 1px 4px rgba(245, 158, 11, 0.35);
        }
        .header-btn-avatar.sky {
            border-color: #38bdf8;
            box-shadow: 0 1px 4px rgba(56, 189, 248, 0.35);
        }
        .header-btn-avatar.emerald {
            border-color: #10b981;
            box-shadow: 0 1px 4px rgba(16, 185, 129, 0.35);
        }
        .header-btn-avatar img {
            width: 88%;
            height: 88%;
            object-fit: contain;
            border-radius: 50%;
        }

        /* 頁籤切換按鈕活化效果 */
        .mode-tab-btn.active {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #090d16;
            font-weight: 800;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
        }
        .mode-tab-btn.typass-active {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #090d16;
            font-weight: 800;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
        }

        /* 範圍切換按鈕 */
        .scope-btn.active {
            background: #0284c7;
            color: #ffffff;
            font-weight: 700;
            border-color: #38bdf8;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
        }

        /* 區域/行政區標籤 */
        .area-pill.active {
            background: #38bdf8;
            color: #090d16;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
        }

        /* 同一座標多店全列出清單 (無橫拉條、垂直整齊排列) */
        .multi-store-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 9px;
            border-radius: 6px;
            border: 1px solid rgba(71, 85, 105, 0.6);
            border-left: 3.5px solid rgba(100, 116, 139, 0.6);
            background: rgba(30, 41, 59, 0.65);
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            box-sizing: border-box;
        }
        .multi-store-row:hover {
            background: rgba(51, 65, 85, 0.85);
            border-color: rgba(56, 189, 248, 0.6);
        }
        .multi-store-row.active {
            background: rgba(14, 165, 233, 0.22);
            border: 1px solid #38bdf8;
            border-left: 3.5px solid #38bdf8;
        }

        /* 滾動條美化 */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        /* 核心 Utility 樣式 */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-1 { flex: 1 1 0%; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .shrink-0 { flex-shrink: 0; }
        .grid { display: grid; }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .col-span-2 { grid-column: span 2 / span 2; }
        .block { display: block; }
        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .overflow-hidden { overflow: hidden; }
        .overflow-y-auto { overflow-y: auto; }
        .overflow-x-auto { overflow-x: auto; }
        .h-16 { height: 4rem; }
        .h-screen { height: 100vh; }
        .w-full { width: 100%; }
        .max-h-36 { max-height: 9rem; }
        .z-10 { z-index: 10; }
        .z-20 { z-index: 20; }

        .gap-0\.5 { gap: 0.125rem; }
        .gap-1 { gap: 0.25rem; }
        .gap-1\.5 { gap: 0.375rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .p-1 { padding: 0.25rem; }
        .p-2 { padding: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .px-1 { padding-left: 0.25rem; padding-right: 0.25rem; }
        .px-1\.5 { padding-left: 0.375rem; padding-right: 0.375rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-2\.5 { padding-left: 0.625rem; padding-right: 0.625rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-1\.5 { padding-top: 0.375rem; padding-bottom: 0.375rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .pr-0\.5 { padding-right: 0.125rem; }
        .pb-2 { padding-bottom: 0.5rem; }
        .mb-1\.5 { margin-bottom: 0.375rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .space-y-1 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.25rem; }
        .space-y-3 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.75rem; }
        .space-y-4 > :not([hidden]) ~ :not([hidden]) { margin-top: 1rem; }

        .bg-slate-800 { background-color: #1e293b; }
        .bg-slate-900 { background-color: #0f172a; }
        .bg-slate-900\/95 { background-color: rgba(15, 23, 42, 0.95); }
        .bg-slate-950 { background-color: #020617; }
        .bg-slate-950\/80 { background-color: rgba(2, 6, 23, 0.8); }
        .bg-amber-500 { background-color: #f59e0b; }
        .bg-amber-500\/10 { background-color: rgba(245, 158, 11, 0.1); }
        .bg-sky-400 { background-color: #38bdf8; }
        button:hover, .hover\:bg-slate-700:hover { background-color: #334155; }
        .hover\:bg-slate-800:hover { background-color: #1e293b; }

        .bg-gradient-to-r {
            background-image: linear-gradient(to right, #fcd34d, #fda4af, #7dd3fc);
        }
        .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
        .text-transparent { color: transparent; -webkit-text-fill-color: transparent; }

        .border { border-width: 1px; border-style: solid; }
        .border-b { border-bottom-width: 1px; border-bottom-style: solid; }
        .border-r { border-right-width: 1px; border-right-style: solid; }
        .border-slate-700 { border-color: #334155; }
        .border-slate-700\/80 { border-color: rgba(51, 65, 85, 0.8); }
        .border-slate-800 { border-color: #1e293b; }
        .border-amber-500\/30 { border-color: rgba(245, 158, 11, 0.3); }
        .rounded { border-radius: 0.375rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-xl { border-radius: 0.75rem; }

        .text-base { font-size: 1rem; line-height: 1.5rem; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-\[9px\] { font-size: 9px; line-height: 12px; }
        .text-\[10px\] { font-size: 10px; line-height: 14px; }
        .text-\[11px\] { font-size: 11px; line-height: 15px; }
        .font-normal { font-weight: 400; }
        .font-medium { font-weight: 500; }
        .font-semibold { font-weight: 600; }
        .font-bold { font-weight: 700; }
        .uppercase { text-transform: uppercase; }
        .tracking-wider { letter-spacing: 0.05em; }
        .text-left { text-align: left; }
        .text-center { text-align: center; }

        .text-amber-300 { color: #fcd34d; }
        .text-amber-400 { color: #fbbf24; }
        .text-sky-300 { color: #7dd3fc; }
        .text-sky-400 { color: #38bdf8; }
        .text-emerald-300 { color: #6ee7b7; }
        .text-rose-300 { color: #fca5a5; }
        .bg-rose-500\/15 { background-color: rgba(244, 63, 94, 0.15); }
        .border-rose-500\/60 { border-color: rgba(244, 63, 94, 0.6); }
        .bg-sky-500\/15 { background-color: rgba(14, 165, 233, 0.15); }
        .border-sky-400\/70 { border-color: rgba(56, 189, 248, 0.7); }
        .border-amber-500\/70 { border-color: rgba(245, 158, 11, 0.7); }
        .text-slate-200 { color: #e2e8f0; }
        .text-slate-300 { color: #cbd5e1; }
        .text-slate-400 { color: #94a3b8; }
        .text-slate-500 { color: #64748b; }
        .text-slate-950 { color: #020617; }

        .opacity-75 { opacity: 0.75; }
        .opacity-80 { opacity: 0.8; }
        .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .shadow-md { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .transition { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
        button { cursor: pointer; }

        /* ⭐ 修正桌機版側邊欄出現無效手機關閉按鈕之缺陷 */
        @media (min-width: 769px) {
            .md\:hidden {
                display: none !important;
            }
        }

        /* ⭐ 搜尋框清除按鈕垂直居中與瀏覽器焦點藍框美化 */
        #searchInput:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 1px #38bdf8;
        }
        #clearSearchBtn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        /* 行動端 RWD 深度優化 (寬度 <= 768px) */
        #mobileFilterToggle { display: none; }
        #mobileBackdrop { display: none; }
        .mobile-header-btn-text { display: inline; }

        @media (max-width: 768px) {
            header {
                height: 52px !important;
                padding-left: 10px !important;
                padding-right: 10px !important;
            }
            .bee-avatar {
                width: 30px !important;
                height: 30px !important;
            }
            header h1 {
                font-size: 13px !important;
            }
            #headerSubtitle {
                display: none !important;
            }
            .mobile-header-btn-text {
                display: none !important;
            }

            /* 側邊欄抽屜化 (Drawer) */
            aside#mainSidebar {
                position: fixed !important;
                top: 0 !important;
                bottom: 0 !important;
                left: 0 !important;
                width: 310px !important;
                max-width: 85vw !important;
                z-index: 100 !important;
                transform: translateX(-100%);
                transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.8);
            }
            aside#mainSidebar.drawer-open {
                transform: translateX(0) !important;
            }

            #mobileBackdrop {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(4px);
                z-index: 90;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.25s ease;
            }
            #mobileBackdrop.drawer-open {
                opacity: 1 !important;
                pointer-events: auto !important;
            }

            /* 手機端底部浮動篩選按鈕 */
            #mobileFilterToggle {
                display: flex !important;
                position: absolute;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 40;
                background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
                color: #ffffff;
                font-size: 13px;
                font-weight: 700;
                padding: 10px 20px;
                border-radius: 9999px;
                box-shadow: 0 8px 24px rgba(2, 132, 199, 0.6), 0 2px 6px rgba(0, 0, 0, 0.4);
                border: 1px solid rgba(56, 189, 248, 0.6);
                align-items: center;
                gap: 6px;
            }

            /* 手機端資訊卡轉為優雅 Bottom Sheet */
            #floatingCard {
                position: fixed !important;
                bottom: 0 !important;
                left: 0 !important;
                right: 0 !important;
                top: auto !important;
                width: 100% !important;
                max-width: 100% !important;
                border-radius: 18px 18px 0 0 !important;
                max-height: 65vh !important;
                overflow-y: auto !important;
                transform: translateY(100%);
                transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
                z-index: 9999 !important;
                box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.9) !important;
                border-bottom: none !important;
            }
            #floatingCard.pinned {
                transform: translateY(0) !important;
            }
        }
    </style>
</head>

        function getCommunityScreenCoords() {
            if (!map || !mapContainer) return null;
            const center = map.getCenter();
            if (!center) return null;
            const zoom = map.getZoom();
            const scale = Math.pow(2, zoom);
            const clat = center.lat();
            const clng = center.lng();
            const csiny = Math.min(Math.max(Math.sin(clat * Math.PI / 180), -0.9999), 0.9999);
            const centerWx = 256 * (0.5 + clng / 360);
            const centerWy = 256 * (0.5 - Math.log((1 + csiny) / (1 - csiny)) / (4 * Math.PI));
            const centerPixelX = centerWx * scale;
            const centerPixelY = centerWy * scale;
            return {
                x: COMMUNITY_WX * scale - centerPixelX + (mapContainer.offsetWidth / 2),
                y: COMMUNITY_WY * scale - centerPixelY + (mapContainer.offsetHeight / 2)
            };

            return {

        // ⭐ 分類圖示與活力色彩對照表（保養維修與教育絕非灰色，灰色嚴格限定給過期/歇業使用）

        // 預先建立離屏類別圖示 Canvas (8 大分類只生成 1 次，GPU 直接 drawImage 渲染)
        const categoryCanvases = {};
        function initCategoryCanvases() {
            const size = 32;
            const dpr = window.devicePixelRatio || 1;
            const categories = Object.keys(CATEGORY_META);

            categories.forEach(cat => {
                const offscreen = document.createElement('canvas');
                offscreen.width = size * dpr;
                offscreen.height = size * dpr;
                const octx = offscreen.getContext('2d');
                octx.scale(dpr, dpr);

                const meta = CATEGORY_META[cat] || { icon: "📍", color: "#0284c7" };

                // 繪製圓角外框
                const r = 8;
                const w = 28, h = 28, x = 2, y = 2;
                octx.beginPath();
                octx.moveTo(x + r, y);
                octx.lineTo(x + w - r, y);
                octx.quadraticCurveTo(x + w, y, x + w, y + r);
                octx.lineTo(x + w, y + h - r);
                octx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                octx.lineTo(x + r, y + h);
                octx.quadraticCurveTo(x, y + h, x, y + h - r);
                octx.lineTo(x, y + r);
                octx.quadraticCurveTo(x, y, x + r, y);
                octx.closePath();

                octx.fillStyle = meta.color;
                octx.fill();

                octx.lineWidth = 2.5;
                octx.strokeStyle = '#38bdf8';
                octx.stroke();

                octx.font = '14px sans-serif';
                octx.textAlign = 'center';
                octx.textBaseline = 'middle';
                octx.fillText(meta.icon, 16, 17);

                categoryCanvases[cat] = offscreen;
            });
        }

        // ⭐ 社區特約專用 SVG 圖示快取（灰色嚴格限定給過期/歇業門市）
        const CONTRACT_ICON_CACHE = {};
        function getContractStoreIcon(store) {
            const isInactive = store.status === 'closed' || store.status === 'expired';
            const cat = store.category || '其他';
            const cacheKey = `${cat}_${isInactive}`;
            if (CONTRACT_ICON_CACHE[cacheKey]) return CONTRACT_ICON_CACHE[cacheKey];

            const meta = CATEGORY_META[cat] || { icon: "📍", color: "#0284c7" };
            // 唯有真正過期或歇業才使用深石板灰，有效店家一律呈現亮眼活力色彩
            const bgColor = isInactive ? "#475569" : meta.color;
            const opacity = isInactive ? "0.55" : "1";
            const strokeColor = isInactive ? "#94a3b8" : "#f59e0b";

            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34" opacity="${opacity}">
                    <rect x="2" y="2" width="30" height="30" rx="10" fill="${bgColor}" stroke="${strokeColor}" stroke-width="2" filter="drop-shadow(0px 3px 5px rgba(0,0,0,0.5))"/>
                    <text x="17" y="23" font-size="16" text-anchor="middle">${meta.icon}</text>
                </svg>
            `;
            const iconObj = {
                url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
                scaledSize: new google.maps.Size(34, 34),
                anchor: new google.maps.Point(17, 17)
            };
            CONTRACT_ICON_CACHE[cacheKey] = iconObj;
            return iconObj;
        }

        function resizeCanvas() {
            const width = mapContainer.offsetWidth;
            const height = mapContainer.offsetHeight;
            if (width === 0 || height === 0) return;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        // ⭐ GPU 向量 Canvas 極速渲染核心（2,276 筆標記 1.2 毫秒全量繪製，60 FPS 流暢無比）
        function drawCanvas() {
            if (currentMode !== 'typass' || !map) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                renderedStoreCoords = [];
                return;
            }

            const width = mapContainer.offsetWidth;
            const height = mapContainer.offsetHeight;
            if (width === 0 || height === 0) return;

            ctx.clearRect(0, 0, width, height);

            const center = map.getCenter();
            if (!center) return;
            const zoom = map.getZoom();
            const scale = Math.pow(2, zoom);

            const clat = center.lat();
            const clng = center.lng();
            const csiny = Math.min(Math.max(Math.sin(clat * Math.PI / 180), -0.9999), 0.9999);
            const centerWx = 256 * (0.5 + clng / 360);
            const centerWy = 256 * (0.5 - Math.log((1 + csiny) / (1 - csiny)) / (4 * Math.PI));

            const centerPixelX = centerWx * scale;
            const centerPixelY = centerWy * scale;
            const halfW = width / 2;
            const halfH = height / 2;

            const visibleCoords = [];
            const ICON_HALF = 16;
            const ICON_SIZE = 32;

            for (let i = 0; i < currentFilteredTypass.length; i++) {
                const s = currentFilteredTypass[i];
                const sx = s.wx * scale - centerPixelX + halfW;
                const sy = s.wy * scale - centerPixelY + halfH;

                // 視口動態裁切 (Viewport Culling)：僅繪製在可視視野及邊緣緩衝區內的點
                if (sx >= -40 && sx <= width + 40 && sy >= -40 && sy <= height + 40) {
                    visibleCoords.push({ sx, sy, store: s });
                    const iconCanvas = categoryCanvases[s.category] || categoryCanvases['其他'];
                    ctx.drawImage(iconCanvas, sx - ICON_HALF, sy - ICON_HALF, ICON_SIZE, ICON_SIZE);
                }
            }

            // 當有店家處於懸浮或釘選時，繪製外光環
            const activeStore = (isPinned && pinnedStoreList.length > 0) ? pinnedStoreList[pinnedIndex] : hoveredStore;
            if (activeStore) {
                const hItem = visibleCoords.find(item => item.store === activeStore);
                if (hItem) {
                    ctx.beginPath();
                    ctx.arc(hItem.sx, hItem.sy, 20, 0, Math.PI * 2);
                    ctx.strokeStyle = isPinned ? '#38bdf8' : '#fde047';
                    ctx.lineWidth = isPinned ? 3.5 : 2.5;
                    ctx.stroke();
                }
            }

            // ⭐ 唯樂蜜蜂社區地標置頂（最上層繪製，優先度 99999，絕不被任何特店遮擋）
            const homePos = getCommunityScreenCoords();
            if (homePos && homePos.x >= -50 && homePos.x <= width + 50 && homePos.y >= -50 && homePos.y <= height + 50) {
                if (homeMarkerImg.complete && homeMarkerImg.naturalWidth > 0) {
                    ctx.drawImage(homeMarkerImg, homePos.x - 23, homePos.y - 23, 46, 46);
                }
            }

            renderedStoreCoords = visibleCoords;
        }

        // 搜尋點擊/游標熱區內的所有店家 (支援同座標多店選取，優先顯示低頻率/獨立特色店家)
        function findNearbyTypassStores(px, py, radius = 22) {
            if (currentMode !== 'typass' || renderedStoreCoords.length === 0) return [];
            const matches = [];
            for (let i = 0; i < renderedStoreCoords.length; i++) {
                const item = renderedStoreCoords[i];
                const dist = Math.hypot(item.sx - px, item.sy - py);
                if (dist <= radius) {
                    matches.push({ store: item.store, dist, sx: item.sx, sy: item.sy });
                }
            }
            if (matches.length <= 1) return matches.map(m => m.store);

            // ⭐ 階層化全序排序 (Tier-based Total Ordering)：徹底解決隔空劫持，並杜絕三元循環死結
            // Tier 0: 核心直接命中區 (距離 minDist <= 6px，同商場/同建築/直接精確點擊)
            // Tier 1: 鄰近路邊伴隨店家 (距離 minDist > 6px，隔壁路邊店家)
            const minDist = Math.min(...matches.map(m => m.dist));
            matches.sort((a, b) => {
                const tierA = (a.dist - minDist <= 6) ? 0 : 1;
                const tierB = (b.dist - minDist <= 6) ? 0 : 1;
                if (tierA !== tierB) return tierA - tierB;
                if (tierA === 0) {
                    // 核心商場聚落內：低頻獨立特色店家置頂 (#1)，高頻連鎖店排最後
                    return (a.store.freq - b.store.freq) || (a.dist - b.dist);
                } else {
                    // 外部伴隨店家：以距離為準 (近者優先)
                    return (a.dist - b.dist) || (a.store.freq - b.store.freq);
                }
            });
            return matches.map(m => m.store);
        }

            homeMarker.addListener('mouseover', (e) => {
                if (isPinned) return;
                showFloatingCard(`
                    <div>
                        <div style="font-weight: 800; color: #fcd34d; font-size: 14px; display: flex; align-items: center; gap: 6px;">
                            <span>🐝</span> 唯樂之丘 (我們社區)
                        </div>

                        <div style="font-size: 11px; color: #38bdf8; margin-top: 2px;">中路重劃區核心生活圈</div>
                    </div>
                `, e, false);

            homeMarker.addListener('mouseout', () => {

            // 初始化離屏 Canvas 圖示與畫布尺寸

            // 地圖縮放與拖曳時透過 RAF 節流重繪

                const mx = e.domEvent.clientX - rect.left;

                // ⭐ 優先度 99999：唯樂之丘社區地標懸浮偵測（置頂優先）

                if (homePos && Math.hypot(mx - homePos.x, my - homePos.y) <= 24) {
                    if (hoveredStore !== 'COMMUNITY') {
                        hoveredStore = 'COMMUNITY';
                        map.setOptions({ draggableCursor: 'pointer' });
                        showFloatingCard(`
                            <div>
                                <div style="font-weight: 800; color: #fcd34d; font-size: 14px; display: flex; align-items: center; gap: 6px;">
                                    <span>🐝</span> 唯樂之丘 (我們社區)

                // ⭐ 優先度 99999：唯樂之丘社區地標點擊偵測（置頂優先）
                const homePos = getCommunityScreenCoords();

                    showFloatingCard(`
                        <div>
                            <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(71, 85, 105, 0.7); padding-bottom: 6px; margin-bottom: 8px;">
                                <span style="font-weight: 800; color: #fcd34d; font-size: 14px; display: flex; align-items: center; gap: 6px;">
                                    <span>🐝</span> 唯樂之丘 (我們社區)
                                </span>
                                <button onclick="unpinStore()" style="background: transparent; border: none; color: #94a3b8; font-size: 16px; cursor: pointer; padding: 0 4px;">✕</button>
                            </div>
                            <div style="font-size: 12px; color: #e2e8f0; margin-bottom: 4px;">📍 桃園市桃園區文中三路18號</div>
                            <div style="font-size: 11px; color: #38bdf8; margin-bottom: 8px;">✨ 中路重劃區核心生活圈・雙享特約地圖中心點</div>
                            <a href="https://maps.google.com/?q=24.996834,121.288802" target="_blank" style="display: block; text-align: center; background: #f59e0b; color: #090d16; text-decoration: none; padding: 6px 8px; border-radius: 6px; font-size: 11px; font-weight: bold;">
                                <span>🗺️ Google 導航回社區 ↗</span>
                            </a>
                        </div>
                    `, e, true);
                    isPinned = true;
                    floatingCard.classList.add('pinned');
                    return;
                }

                // 24px 大熱區容錯，完美支援手機手指點擊
                const clickedStores = findNearbyTypassStores(clickX, clickY, 24);

                if (clickedStores.length > 0) {
                    pinStore(clickedStores, 0, e);
                } else {
                    unpinStore();
                }
            });

            // 建立 40 家社區特約標記 (一次建立，永不銷毀)
            CONTRACT_STORES.forEach(store => {
                const marker = new google.maps.Marker({
                    position: { lat: store.origLat, lng: store.origLng },
                    map: map,
                    title: store.name,
                    icon: getContractStoreIcon(store),
                    visible: true
                });
                marker.__storeData = store;
                marker.addListener('mouseover', (e) => {
                    if (!isPinned) showFloatingCard(generateInfoContent([store], 0, false), e, false);
                });
                marker.addListener('mouseout', () => {
                    if (!isPinned) hideFloatingCard();
                });
                marker.addListener('click', (e) => {
                    pinStore([store], 0, e);
                });
                contractMarkers.push(marker);
            });

            renderCategories();
            renderAreaPills();
            renderStores(false);
        }

        // ⭐ 釘選（Pin）店家資訊卡：支援文字選取、點擊電話、開啟官網與導航
        function pinStore(stores, activeIndex = 0, mouseEvent = null) {
            isPinned = true;
            pinnedStoreList = stores;
            pinnedIndex = activeIndex;
            hoveredStore = stores[activeIndex];

            floatingCard.classList.add('pinned');
            showFloatingCard(generateInfoContent(stores, activeIndex, true), mouseEvent, true);
            requestDraw();
        }

        function unpinStore() {
            if (!isPinned) return;
            isPinned = false;
            pinnedStoreList = [];
            pinnedIndex = 0;
            hoveredStore = null;
            floatingCard.classList.remove('pinned');
            hideFloatingCard();
            requestDraw();
        }

        function switchPinnedStoreIndex(index) {
            if (!isPinned || !pinnedStoreList || pinnedStoreList.length === 0) return;
            pinnedIndex = index;
            hoveredStore = pinnedStoreList[index];

            // 1. 原地替換 HTML 內容，保證卡片錨點絕不跳動
            floatingCard.innerHTML = generateInfoContent(pinnedStoreList, pinnedIndex, true);

            // 2. 桌面端全方位邊界保護：卡片增長時防止溢出可視區域
            if (window.innerWidth > 768) {
                const containerRect = mapContainer.getBoundingClientRect();
                const cardHeight = floatingCard.offsetHeight || 260;
                const cardWidth = 340;

                let currentLeft = parseFloat(floatingCard.style.left) || 15;
                let currentTop = parseFloat(floatingCard.style.top) || 15;

                if (currentLeft + cardWidth > containerRect.width - 15) {
                    currentLeft = Math.max(15, containerRect.width - cardWidth - 15);
                    floatingCard.style.left = `${currentLeft}px`;
                }
                if (currentLeft < 15) {
                    floatingCard.style.left = '15px';
                }

                if (currentTop + cardHeight > containerRect.height - 15) {
                    currentTop = Math.max(15, containerRect.height - cardHeight - 15);
                    floatingCard.style.top = `${currentTop}px`;
                }
                if (currentTop < 15) {
                    floatingCard.style.top = '15px';
                }
            }
            requestDraw();
        }

        // ⭐ 手機版側邊欄抽屜開關
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('mainSidebar');
            const backdrop = document.getElementById('mobileBackdrop');
            const isOpen = sidebar.classList.contains('drawer-open');
            if (isOpen) {
                sidebar.classList.remove('drawer-open');
                backdrop.classList.remove('drawer-open');
            } else {
                sidebar.classList.add('drawer-open');
                backdrop.classList.add('drawer-open');
            }
        }

        // ⭐ 即時關鍵字搜尋處理函式
        function handleSearch(val) {
            currentSearchQuery = val.trim().toLowerCase();
            const clearBtn = document.getElementById('clearSearchBtn');
            if (currentSearchQuery) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderStores(false);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            currentSearchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderStores(false);
        }

        // ⭐ 雙頁籤模式切換 (社區特約 vs 桃園市民卡)
        function switchMode(mode) {
            unpinStore();
            currentMode = mode;
            currentSubArea = '全部';
            currentDiscount = 'all';

            const tabContract = document.getElementById('tab-contract');
            const tabTypass = document.getElementById('tab-typass');

            const benefitSec = document.getElementById('section-typass-benefits');
            if (mode === 'contract') {
                tabContract.className = 'mode-tab-btn py-2 px-2.5 rounded-lg text-xs font-bold text-center transition flex flex-col items-center justify-center gap-0.5 active';
                tabTypass.className = 'mode-tab-btn py-2 px-2.5 rounded-lg text-xs font-medium text-slate-300 text-center transition flex flex-col items-center justify-center gap-0.5 hover:bg-slate-800';
                document.getElementById('headerSubtitle').innerText = '最後更新 : 2026/11/18 ｜ 社區特約模式 (40家)';
                document.getElementById('section-contract-filter').classList.remove('hidden');
                document.getElementById('section-typass-area-filter').classList.add('hidden');
                if (benefitSec) benefitSec.classList.add('hidden');
                canvas.style.display = 'none';
            } else {
                tabContract.className = 'mode-tab-btn py-2 px-2.5 rounded-lg text-xs font-medium text-slate-300 text-center transition flex flex-col items-center justify-center gap-0.5 hover:bg-slate-800';
                tabTypass.className = 'mode-tab-btn py-2 px-2.5 rounded-lg text-xs font-bold text-center transition flex flex-col items-center justify-center gap-0.5 typass-active';
                document.getElementById('headerSubtitle').innerText = '最後更新 : 2026/11/18 ｜ 桃園市民卡模式 (全台特約與市政場館)';
                document.getElementById('section-contract-filter').classList.add('hidden');
                document.getElementById('section-typass-area-filter').classList.remove('hidden');
                if (benefitSec) benefitSec.classList.remove('hidden');
                canvas.style.display = 'block';
            }

            renderAreaPills();
            renderCategories();
            renderStores(false);
        }

        // 取得當前市民卡模式下的範疇資料集
        function getTypassScopedDataset() {
            if (currentTypassScope === 'taoyuan') {
                return TYPASS_STORES.filter(s => s.is_taoyuan);
            } else if (currentTypassScope === 'other') {
                return TYPASS_STORES.filter(s => !s.is_taoyuan);
            } else {
                return TYPASS_STORES;
            }
        }

        // 市民卡 範疇切換 (桃園本轄 / 外縣市 / 全台)
        function setTypassScope(scope) {
            unpinStore();
            currentTypassScope = scope;
            currentSubArea = '全部';

            document.getElementById('btn-scope-taoyuan').className = (scope === 'taoyuan')
                ? 'scope-btn py-1.5 px-1 rounded-lg text-xs font-bold transition active flex flex-col items-center'
                : 'scope-btn py-1.5 px-1 rounded-lg text-xs font-medium text-slate-300 transition hover:bg-slate-800 flex flex-col items-center';

            document.getElementById('btn-scope-other').className = (scope === 'other')
                ? 'scope-btn py-1.5 px-1 rounded-lg text-xs font-bold transition active flex flex-col items-center'
                : 'scope-btn py-1.5 px-1 rounded-lg text-xs font-medium text-slate-300 transition hover:bg-slate-800 flex flex-col items-center';

            document.getElementById('btn-scope-all').className = (scope === 'all')
                ? 'scope-btn py-1.5 px-1 rounded-lg text-xs font-bold transition active flex flex-col items-center'
                : 'scope-btn py-1.5 px-1 rounded-lg text-xs font-medium text-slate-300 transition hover:bg-slate-800 flex flex-col items-center';

            renderAreaPills();
            renderCategories();
            renderStores(scope !== 'taoyuan');
        }

        // 次級區域 (行政區 / 縣市) 標籤動態生成
        function renderAreaPills() {
            if (currentMode !== 'typass') return;

            const container = document.getElementById('areaPillsContainer');
            const subTitle = document.getElementById('subAreaTitle');

            const scopedData = getTypassScopedDataset();

            if (currentTypassScope === 'taoyuan') {
                subTitle.innerHTML = `<span>🏙️</span> 桃園市 13 行政區`;
                const distCounts = {};
                for (let i = 0; i < scopedData.length; i++) {
                    const d = scopedData[i].district;
                    distCounts[d] = (distCounts[d] || 0) + 1;
                }

                let html = '';
                for (let i = 0; i < TAOYUAN_DISTRICTS.length; i++) {
                    const dist = TAOYUAN_DISTRICTS[i];
                    const count = (dist === '全部') ? scopedData.length : (distCounts[dist] || 0);
                    const isSelected = (currentSubArea === dist);
                    const cls = isSelected
                        ? 'area-pill py-1 px-1.5 rounded-lg text-[11px] font-bold text-center transition bg-sky-400 text-slate-950 shadow-md'
                        : 'area-pill py-1 px-1.5 rounded-lg text-[11px] font-medium text-center transition bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/80';
                    html += `<button onclick="setSubAreaFilter('${dist}')" id="pill-area-${dist}" class="${cls}"><span>${dist}</span> <span class="text-[9px] opacity-75">(${count})</span></button>`;
                }
                container.innerHTML = html;
            } else {
                subTitle.innerHTML = (currentTypassScope === 'other') ? `<span>🗾</span> 外縣市門市名冊` : `<span>🗺️</span> 全台縣市分佈`;
                
                const cityCounts = {};
                for (let i = 0; i < scopedData.length; i++) {
                    const c = scopedData[i].city;
                    cityCounts[c] = (cityCounts[c] || 0) + 1;
                }

                const sortedCities = ['全部', ...Object.keys(cityCounts).sort((a,b) => cityCounts[b] - cityCounts[a])];

                let html = '';
                for (let i = 0; i < sortedCities.length; i++) {
                    const city = sortedCities[i];
                    const count = (city === '全部') ? scopedData.length : (cityCounts[city] || 0);
                    const isSelected = (currentSubArea === city);
                    const cls = isSelected
                        ? 'area-pill py-1 px-1.5 rounded-lg text-[11px] font-bold text-center transition bg-sky-400 text-slate-950 shadow-md'
                        : 'area-pill py-1 px-1.5 rounded-lg text-[11px] font-medium text-center transition bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/80';
                    html += `<button onclick="setSubAreaFilter('${city}')" id="pill-area-${city}" class="${cls}"><span>${city}</span> <span class="text-[9px] opacity-75">(${count})</span></button>`;
                }
                container.innerHTML = html;
            }
        }

        // ⭐ 行政區過濾設定
        function setSubAreaFilter(area) {
            unpinStore();
            currentSubArea = area;

            renderAreaPills();
            renderCategories();
            renderStores(area !== '全部');
        }

        function renderCategories() {
            const listContainer = document.getElementById('categoryList');
            const availableCats = getAvailableCategories();
            const selectedSet = getSelectedCategories();

            let dataset;
            if (currentMode === 'contract') {
                dataset = CONTRACT_STORES;
            } else {
                let base = getTypassScopedDataset();
                if (currentSubArea !== '全部') {
                    if (currentTypassScope === 'taoyuan') {
                        base = base.filter(s => s.district === currentSubArea);
                    } else {
                        base = base.filter(s => s.city === currentSubArea);
                    }
                }
                dataset = base;
            }
            
            const counts = {};
            for (let i = 0; i < dataset.length; i++) {
                const c = dataset[i].category;
                counts[c] = (counts[c] || 0) + 1;
            }

            // 依店家數量降序排序，數量多的優先排在上方
            const sortedCats = [...availableCats].sort((a, b) => (counts[b] || 0) - (counts[a] || 0));

            // 更新頂部「全部選取 / 全部取消」狀態與提示文字
            const totalCount = availableCats.length;
            const selCount = selectedSet.size;
            const subNotice = document.getElementById('categorySubNotice');
            if (subNotice) {
                if (selCount === totalCount) {
                    subNotice.innerText = `已全選 (${selCount}/${totalCount})`;
                } else if (selCount === 0) {
                    subNotice.innerText = `已取消 (0/${totalCount})`;
                } else {
                    subNotice.innerText = `已選 ${selCount}/${totalCount} 類`;
                }
            }

            const btnAll = document.getElementById('btnSelectAllCat');
            const btnNone = document.getElementById('btnDeselectAllCat');
            if (btnAll && btnNone) {
                if (selCount === totalCount) {
                    btnAll.className = (currentMode === 'contract')
                        ? 'py-1.5 px-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 bg-amber-500/15 border border-amber-500/70 text-amber-300 shadow-sm'
                        : 'py-1.5 px-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 bg-sky-500/15 border border-sky-400/70 text-sky-300 shadow-sm';
                    btnNone.className = 'py-1.5 px-2 rounded-lg text-xs font-medium transition flex items-center justify-center gap-1.5 bg-slate-800/80 hover:bg-slate-700 text-slate-400 border border-slate-700/80';
                } else if (selCount === 0) {
                    btnAll.className = 'py-1.5 px-2 rounded-lg text-xs font-medium transition flex items-center justify-center gap-1.5 bg-slate-800/80 hover:bg-slate-700 text-slate-400 border border-slate-700/80';
                    btnNone.className = 'py-1.5 px-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 bg-rose-500/15 border border-rose-500/60 text-rose-300 shadow-sm';
                } else {
                    btnAll.className = 'py-1.5 px-2 rounded-lg text-xs font-medium transition flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700';
                    btnNone.className = 'py-1.5 px-2 rounded-lg text-xs font-medium transition flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700';
                }
            }

            let html = '';
            for (let i = 0; i < sortedCats.length; i++) {
                const cat = sortedCats[i];
                const meta = CATEGORY_META[cat] || { icon: "📍", color: "#64748b" };
                const isSelected = selectedSet.has(cat);
                const count = counts[cat] || 0;

                let btnCls, badgeCls, checkIcon;
                if (isSelected) {
                    checkIcon = '✓';
                    if (currentMode === 'contract') {
                        btnCls = 'cat-btn w-full py-1.5 px-3 rounded-lg text-xs font-bold text-left transition bg-amber-500 text-slate-950 shadow-md flex items-center justify-between';
                        badgeCls = 'text-[10px] font-extrabold bg-slate-950/20 px-1.5 py-0.5 rounded text-slate-950';
                    } else {
                        btnCls = 'cat-btn w-full py-1.5 px-3 rounded-lg text-xs font-bold text-left transition bg-sky-400 text-slate-950 shadow-md flex items-center justify-between';
                        badgeCls = 'text-[10px] font-extrabold bg-slate-950/20 px-1.5 py-0.5 rounded text-slate-950';
                    }
                } else {
                    checkIcon = '◻';
                    btnCls = 'cat-btn w-full py-1.5 px-3 rounded-lg text-xs font-medium text-left transition bg-slate-900/80 hover:bg-slate-800 text-slate-400 border border-slate-800/80 flex items-center justify-between opacity-65';
                    badgeCls = 'text-[10px] text-slate-500 font-semibold';
                }

                html += `<button type="button" onclick="toggleCategoryFilter('${cat}')" id="cat-btn-${cat}" class="${btnCls}">` +
                        `<span class="flex items-center gap-1.5">` +
                            `<span class="text-[11px] font-black">${checkIcon}</span>` +
                            `<span>${meta.icon} ${cat}</span>` +
                        `</span>` +
                        `<span class="${badgeCls}">${count}</span>` +
                        `</button>`;
            }
            listContainer.innerHTML = html;
        }

        function showFloatingCard(html, mouseEvent, pinned = false) {
            floatingCard.innerHTML = html;
            floatingCard.style.display = 'block';

            // 若為手機螢幕（寬度 <= 768px），由 CSS Bottom Sheet 接手排版
            if (window.innerWidth <= 768) {
                floatingCard.style.left = '0';
                floatingCard.style.top = 'auto';
                floatingCard.style.bottom = '0';
                floatingCard.style.opacity = '1';
                return;
            }

            // 桌面端智慧座標對齊與全方位防溢出
            const cardWidth = 340;
            const containerRect = mapContainer.getBoundingClientRect();
            const cardHeight = floatingCard.offsetHeight || 260;

            let x, y;
            if (mouseEvent && mouseEvent.domEvent) {
                x = mouseEvent.domEvent.clientX - containerRect.left;
                y = mouseEvent.domEvent.clientY - containerRect.top;
            } else {
                const curLeft = parseFloat(floatingCard.style.left);
                const curTop = parseFloat(floatingCard.style.top);
                if (!isNaN(curLeft) && !isNaN(curTop)) {
                    x = curLeft;
                    y = curTop;
                } else {
                    x = containerRect.width / 2;
                    y = containerRect.height / 2;
                }
            }

            // 水平對齊：優先放右側，放不下則放左側，並夾在 [15, width - cardWidth - 15] 範圍內
            let left = x + 18;
            if (left + cardWidth > containerRect.width - 15) {
                left = x - cardWidth - 18;
            }
            if (left + cardWidth > containerRect.width - 15) {
                left = containerRect.width - cardWidth - 15;
            }
            if (left < 15) {
                left = 15;
            }

            // 垂直對齊：優先放上方，上方放不下放下方，並夾在 [15, height - cardHeight - 15] 範圍內
            let top = y - cardHeight - 12;
            if (top < 15) {
                top = y + 20;
            }
            if (top + cardHeight > containerRect.height - 15) {
                top = containerRect.height - cardHeight - 15;
            }
            if (top < 15) {
                top = 15;
            }

            floatingCard.style.left = `${left}px`;
            floatingCard.style.top = `${top}px`;
            floatingCard.style.bottom = 'auto';
            floatingCard.style.opacity = '1';
        }

        function hideFloatingCard() {
            if (isPinned) return;
            floatingCard.style.opacity = '0';
            floatingCard.style.display = 'none';
        }

        // ⭐ 資訊卡內容生成器 (包含手機拖曳把手、放大 ✕ 關閉按鈕、一鍵電話撥打、導航與官網)
        function generateInfoContent(stores, activeIndex = 0, pinned = false) {
            const store = stores[activeIndex] || stores[0];
            const hasMultiple = stores.length > 1;

            // 手機版 Bottom Sheet 頂部拖曳把手導引條
            const dragHandleHtml = `
                <div style="width: 40px; height: 4px; background: #475569; border-radius: 9999px; margin: 0 auto 10px auto;" class="md:hidden"></div>
            `;

            // 頂部多店切換清單（解決商場同座標多店覆蓋問題，全列出無橫拉條）
            let multiStoreBar = '';
            if (hasMultiple) {
                const storeRows = stores.map((s, idx) => {
                    const isActive = (idx === activeIndex);
                    const rowClass = isActive ? 'multi-store-row active' : 'multi-store-row';
                    const numBadge = isActive 
                        ? 'background: #0284c7; color: #ffffff;' 
                        : 'background: rgba(51, 65, 85, 0.8); color: #94a3b8;';
                    const nameStyle = isActive 
                        ? 'color: #f8fafc; font-weight: 700;' 
                        : 'color: #cbd5e1; font-weight: 500;';
                    const catStyle = isActive 
                        ? 'color: #7dd3fc; font-weight: 600;' 
                        : 'color: #94a3b8;';
                    const activeNotice = isActive 
                        ? '<span style="font-size: 10px; color: #38bdf8; font-weight: bold; flex-shrink: 0;">✓ 正在查看</span>' 
                        : '';
                    const catLabel = s.category || '';

                    return `
                        <button onclick="switchPinnedStoreIndex(${idx})" class="${rowClass}">
                            <div style="display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1;">
                                <span style="${numBadge} font-size: 10px; font-weight: bold; padding: 1px 5px; border-radius: 4px; flex-shrink: 0;">#${idx + 1}</span>
                                <span style="${nameStyle} font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHTML(s.name)}</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
                                <span style="font-size: 10px; ${catStyle}">${escapeHTML(catLabel)}</span>
                                ${activeNotice}
                            </div>
                        </button>
                    `;
                }).join('');

                multiStoreBar = `
                    <div style="background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 8px; padding: 7px 9px; margin-bottom: 8px;">
                        <div style="font-size: 11px; color: #38bdf8; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between;">
                            <span>🏢 此地點共有 ${stores.length} 間特約店家：</span>
                            <span style="font-size: 10px; color: #94a3b8;">${activeIndex + 1} / ${stores.length}</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px; max-height: 150px; overflow-y: auto; overflow-x: hidden; padding-right: 2px;">
                            ${storeRows}
                        </div>
                    </div>
                `;
            }

            // 關閉/釘選按鈕 (放大觸控點擊熱區至 32px，防手機誤觸)
            const closeBtnHtml = pinned ? `
                <button onclick="unpinStore()" style="background: rgba(51, 65, 85, 0.9); border: 1px solid rgba(148, 163, 184, 0.4); color: #cbd5e1; border-radius: 8px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.15s ease;" title="關閉">
                    ✕
                </button>
            ` : '';

            if (store.mode === 'typass') {
                const locationLabel = store.district ? `${store.city}・${store.district}` : store.city;

        // ⭐ 折扣幅度精確比對（修正 95 折把 0 折/贈品混入之缺陷）
        function checkStoreDiscount(store, discKey) {
            if (discKey !== 'all' && store.status !== 'active') return false;
            if (discKey === 'all') return true;
            if (discKey === '95') return (store.discountPercent > 0 && store.discountPercent <= 95);
            if (discKey === '90') return (store.discountPercent > 0 && store.discountPercent <= 90);
            if (discKey === '88') return store.discountPercent === 88;
            if (discKey === '85') return (store.discountPercent > 0 && store.discountPercent <= 85);
            if (discKey === 'other') return store.discountPercent === 0;
            return false;
        }

        function updateDynamicCounters() {
            if (currentMode === 'contract') {
                const storesInCurrentCat = CONTRACT_STORES.filter(s => selectedContractCategories.has(s.category));
                document.getElementById('badge-all').innerText = storesInCurrentCat.length;
                document.getElementById('badge-95').innerText = storesInCurrentCat.filter(s => checkStoreDiscount(s, '95')).length;
                document.getElementById('badge-90').innerText = storesInCurrentCat.filter(s => checkStoreDiscount(s, '90')).length;
                document.getElementById('badge-88').innerText = storesInCurrentCat.filter(s => checkStoreDiscount(s, '88')).length;
                document.getElementById('badge-85').innerText = storesInCurrentCat.filter(s => checkStoreDiscount(s, '85')).length;
                document.getElementById('badge-other').innerText = storesInCurrentCat.filter(s => checkStoreDiscount(s, 'other')).length;
            }
        }

        // ⭐ 手機端與桌機端 Header 徽章字串智慧自適應（徹底避免 375px/390px 擠壓爆版）
        let lastBadgeStats = { current: 0, total: 0, scope: '' };
        function updateBadge(currentCount, totalCount, scopeNotice) {
            if (currentCount !== undefined) lastBadgeStats.current = currentCount;
            if (totalCount !== undefined) lastBadgeStats.total = totalCount;
            if (scopeNotice !== undefined) lastBadgeStats.scope = scopeNotice;

            const isMobile = window.innerWidth <= 768;
            const badge = document.getElementById('storeCountBadge');
            if (currentMode === 'contract') {
                badge.innerText = isMobile ? `${lastBadgeStats.current} 家特約` : `已顯示 ${lastBadgeStats.current} / 40 家社區特約`;
            } else {
                badge.innerText = isMobile ? `${lastBadgeStats.current} 家` : `已顯示 ${lastBadgeStats.current} / 2,276 家市民卡特店 (${lastBadgeStats.scope})`;
            }
        }

        // ⭐ 超高效能雙渲染管線：社區特約 (DOM Marker) ＋ 桃園市民卡 2,276家 (GPU 向量 Canvas)
        function renderStores(shouldFitBounds = false) {
            if (currentMode === 'contract') {
                // 1. 社區特約模式：顯示 40 家 DOM Marker
                const filtered = CONTRACT_STORES.filter(store => {
                    const matchCat = selectedContractCategories.has(store.category);
                    const matchDisc = checkStoreDiscount(store, currentDiscount);
                    let matchSearch = true;
                    if (currentSearchQuery) {
                        const text = `${store.name} ${store.address} ${store.discountDetail || ''} ${store.discountBadge || ''}`.toLowerCase();
                        matchSearch = text.includes(currentSearchQuery);
                    }
                    return matchCat && matchDisc && matchSearch;
                });

                updateBadge(filtered.length, 40, '特約生活圈');
                updateDynamicCounters();

                const filteredSet = new Set(filtered.map(s => s.name));
                for (let i = 0; i < contractMarkers.length; i++) {
                    const m = contractMarkers[i];
                    m.setVisible(filteredSet.has(m.__storeData.name));
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                renderedStoreCoords = [];

                if (shouldFitBounds && filtered.length > 0) {
                    const bounds = new google.maps.LatLngBounds();
                    bounds.extend(COMMUNITY_COORDS);
                    filtered.forEach(s => bounds.extend({ lat: s.origLat, lng: s.origLng }));
                    map.fitBounds(bounds, { top: 30, bottom: 30, left: 30, right: 30 });
                }
            } else {
                // 2. 桃園市民卡模式：隱藏社區特約 Marker，啟用 GPU Canvas 極速繪製 2,276 筆
                for (let i = 0; i < contractMarkers.length; i++) {
                    contractMarkers[i].setVisible(false);
                }

                let base = getTypassScopedDataset();
                if (currentSubArea !== '全部') {
                    if (currentTypassScope === 'taoyuan') {
                        base = base.filter(s => s.district === currentSubArea);
                    } else {
                        base = base.filter(s => s.city === currentSubArea);
                    }
                }
                currentFilteredTypass = base.filter(store => {
                    const matchCat = selectedTypassCategories.has(store.category);
                    let matchSearch = true;
                    if (currentSearchQuery) {
                        const text = `${store.name} ${store.address} ${store.discount_summary} ${store.city} ${store.district}`.toLowerCase();
                        matchSearch = text.includes(currentSearchQuery);
                    }
                    return matchCat && matchSearch;
                });

                // ⭐ 依連鎖店出現頻率降序排列 (High freq first -> Low freq last)
                // Canvas 繪圖先畫高頻連鎖店（沉在底層），後畫低頻/獨立特色店家（浮在最上層，優先被看見）
                currentFilteredTypass.sort((a, b) => b.freq - a.freq);

                let scopeNotice = '';
                if (currentTypassScope === 'taoyuan') {
                    scopeNotice = (currentSubArea === '全部') ? '桃園本轄' : currentSubArea;
                } else if (currentTypassScope === 'other') {
                    scopeNotice = (currentSubArea === '全部') ? '外縣市' : currentSubArea;
                } else {
                    scopeNotice = (currentSubArea === '全部') ? '全台灣' : currentSubArea;
                }

                updateBadge(currentFilteredTypass.length, 2276, scopeNotice);

                if (shouldFitBounds && currentFilteredTypass.length > 0) {
                    const bounds = new google.maps.LatLngBounds();
                    if (currentTypassScope === 'taoyuan' && currentSubArea === '全部') {
                        bounds.extend(COMMUNITY_COORDS);
                    }
                    currentFilteredTypass.forEach(s => bounds.extend({ lat: s.origLat, lng: s.origLng }));
                    map.fitBounds(bounds, { top: 30, bottom: 30, left: 30, right: 30 });
                }

                // 極速繪製 (耗時 < 1.5ms，0 毫秒體感延遲)
                requestDraw();
            }
        }

        }

        function openBenefitModal(type) {
            const data = MUNICIPAL_BENEFITS[type];
            if (!data) return;

            document.getElementById('benefitModalIcon').innerText = data.icon;
            document.getElementById('benefitModalTitle').innerText = data.title;
            const tagEl = document.getElementById('benefitModalTag');
            tagEl.innerText = data.tag;
            tagEl.style.cssText = `display: inline-block; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-top: 2px; ${data.badgeColor}`;

            let html = '';
            data.items.forEach(item => {
                let borderStyle = 'border: 1px solid rgba(71, 85, 105, 0.4);';
                let tagBadge = '';
                if (item.tag === '優惠內容') {
                    borderStyle = 'border: 1px solid rgba(16, 185, 129, 0.45); background: rgba(6, 78, 59, 0.25);';
                    tagBadge = '<span style="font-size: 10px; padding: 1px 6px; border-radius: 4px; background: rgba(16, 185, 129, 0.25); color: #34d399; font-weight: 700; margin-right: 6px;">優惠內容</span>';
                } else if (item.tag === '使用規則') {
                    borderStyle = 'border: 1px solid rgba(56, 189, 248, 0.45); background: rgba(12, 74, 110, 0.25);';
                    tagBadge = '<span style="font-size: 10px; padding: 1px 6px; border-radius: 4px; background: rgba(56, 189, 248, 0.25); color: #38bdf8; font-weight: 700; margin-right: 6px;">使用規則</span>';
                } else if (item.tag === '注意事項') {
                    borderStyle = 'border: 1px solid rgba(245, 158, 11, 0.45); background: rgba(120, 53, 15, 0.25);';
                    tagBadge = '<span style="font-size: 10px; padding: 1px 6px; border-radius: 4px; background: rgba(245, 158, 11, 0.25); color: #fbbf24; font-weight: 700; margin-right: 6px;">注意事項</span>';
                }
                html += `
                    <div style="${borderStyle} border-radius: 10px; padding: 12px 14px;">
                        <div style="font-weight: 700; color: #f8fafc; font-size: 13px; margin-bottom: 6px; display: flex; align-items: center;">
                            ${tagBadge}
                            <span>${escapeHTML(item.title)}</span>
                        </div>
                        <div style="color: #cbd5e1; font-size: 12px; line-height: 1.6; white-space: pre-line;">${escapeHTML(item.desc)}</div>
                    </div>
                `;
            });
            document.getElementById('benefitModalContent').innerHTML = html;

            let actionHtml = '';
            data.links.forEach(link => {
                actionHtml += `
                    <a href="${link.url}" target="_blank" rel="noopener noreferrer" style="${link.color} font-size: 12px; font-weight: bold; text-decoration: none; padding: 8px 14px; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px; transition: opacity 0.15s ease;">
                        ${escapeHTML(link.text)}
                    </a>
                `;
            });
            document.getElementById('benefitModalActions').innerHTML = actionHtml;

            document.getElementById('benefitModalBackdrop').style.display = 'block';
            document.getElementById('benefitModal').style.display = 'block';
        }

        function closeBenefitModal() {
            document.getElementById('benefitModalBackdrop').style.display = 'none';
            document.getElementById('benefitModal').style.display = 'none';
        }
    </script>

<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唯樂之丘社區・40家特約生活地圖</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* ⭐ 智慧懸浮資訊卡 (純 CSS 浮動跟隨，完全不觸發地圖移動) */
        #floatingCard {
            display: none;
            position: absolute;
            z-index: 50;
            pointer-events: none;
            transition: opacity 0.15s ease-out;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(245, 158, 11, 0.6);
            border-radius: 14px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            padding: 13px 15px;
            width: 290px;
            box-sizing: border-box;
        }
        /* 唯樂蜜蜂頭像框 */
        .bee-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #f59e0b;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .bee-avatar img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }
        /* 滾動條美化 */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>

                "discountPercent": 0,
                "discountBadge": "其他",
                "discountDetail": "產後無痛泌乳折價 500 元，到府免車馬費，預約再送按摩精油",
                "expiry": "無期限",
                "status": "active",
                "statusNote": "合約有效中",
                "lat": 25.050185,
                "lng": 121.289279
        },
        {
                "name": "麵粉酵母鹽與水 (手作歐式麵包)",
                "category": "餐飲",
                "address": "桃園市桃園區正光一街101號",
                "phone": "0958-434583",
                "discountPercent": 95,
                "discountBadge": "95折",
                "discountDetail": "全品項 95 折，不定期推出獨家限定款商品組合優惠價",
                "expiry": "無期限",
                "status": "active",
                "statusNote": "合約有效中",
                "lat": 24.999049,
                "lng": 121.293225
        },
        {
                "name": "名匠汽車專業美研 (正光旗艦店)",
                "category": "保養維修",
                "address": "桃園市桃園區正光路327號",
                "phone": "03-6210931",
                "discountPercent": 88,
                "discountBadge": "88折",
                "discountDetail": "享四重限時特惠！CAFE!N 跨界精品洗車、鍍膜及輪胎快保享社區 88 折",
                "expiry": "2026/06/01 至 2027/12/31",
                "status": "active",
                "statusNote": "合約有效中",
                "lat": 24.999072,
                "lng": 121.294812
        }
];

        // 分類圖示與主題色
        const CATEGORY_META = {
            "餐飲": { icon: "🍔", color: "#f97316" },
            "醫療照顧": { icon: "💊", color: "#06b6d4" },
            "居家生活": { icon: "🏡", color: "#10b981" },
            "保養維修": { icon: "🔧", color: "#eab308" },
            "消費購物": { icon: "🛍️", color: "#8b5cf6" },
            "教育": { icon: "🎓", color: "#3b82f6" },
            "娛樂": { icon: "🎮", color: "#ec4899" },
            "其他": { icon: "📦", color: "#64748b" }
        };

        // ⭐ 50% 碰撞距離分離 (Spidered Coordinates)：重疊或極近點向外錯開半個圖示距離
        const STORES = (() => {
            const groups = {};
            RAW_STORES.forEach(s => {
                const key = `${s.lat.toFixed(4)},${s.lng.toFixed(4)}`;
                if (!groups[key]) groups[key] = [];
                groups[key].push(s);
            });

            const processed = [];
            Object.values(groups).forEach(group => {
                if (group.length === 1) {
                    processed.push(group[0]);
                } else {
                    const offsetDistance = 0.00018; 
                    group.forEach((s, idx) => {
                        const angle = (2 * Math.PI / group.length) * idx;
                        const copy = { ...s };
                        copy.lat = s.lat + offsetDistance * Math.cos(angle);
                        copy.lng = s.lng + offsetDistance * Math.sin(angle) * 1.1;
                        copy.isDisplaced = true;
                        processed.push(copy);
                    });
                }
            });
            return processed;
        })();

        let map;
        let markers = [];
        let homeMarker;
        let currentCategory = '全部';
        let currentDiscount = 'all';

        const floatingCard = document.getElementById('floatingCard');
        const mapContainer = document.getElementById('mapContainer');

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: COMMUNITY_COORDS,
                zoom: 15,
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: false,
                styles: [
                    { "elementType": "geometry", "stylers": [{ "color": "#1d2c4d" }] },
                    { "elementType": "labels.text.fill", "stylers": [{ "color": "#8ec3b9" }] },
                    { "elementType": "labels.text.stroke", "stylers": [{ "color": "#1a3646" }] },
                    { "featureType": "poi", "elementType": "all", "stylers": [{ "visibility": "off" }] },
                    { "featureType": "transit.station", "elementType": "all", "stylers": [{ "visibility": "off" }] },
                    { "featureType": "administrative.country", "elementType": "geometry.stroke", "stylers": [{ "color": "#4b6878" }] },
                    { "featureType": "administrative.land_parcel", "elementType": "labels.text.fill", "stylers": [{ "color": "#64779e" }] },
                    { "featureType": "administrative.province", "elementType": "geometry.stroke", "stylers": [{ "color": "#4b6878" }] },
                    { "featureType": "landscape.man_made", "elementType": "geometry.stroke", "stylers": [{ "color": "#334e87" }] },
                    { "featureType": "landscape.natural", "elementType": "geometry", "stylers": [{ "color": "#023e58" }] },
                    { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#304a7d" }] },
                    { "featureType": "road", "elementType": "labels.text.fill", "stylers": [{ "color": "#98a5be" }] },
                    { "featureType": "road", "elementType": "labels.text.stroke", "stylers": [{ "color": "#1d2c4d" }] },
                    { "featureType": "road.highway", "elementType": "geometry", "stylers": [{ "color": "#2c6675" }] },
                    { "featureType": "road.highway", "elementType": "geometry.stroke", "stylers": [{ "color": "#255763" }] },
                    { "featureType": "road.highway", "elementType": "labels.text.fill", "stylers": [{ "color": "#b0d5ce" }] },
                    { "featureType": "road.highway", "elementType": "labels.text.stroke", "stylers": [{ "color": "#023e58" }] },
                    { "featureType": "transit.line", "elementType": "geometry.fill", "stylers": [{ "color": "#283d6a" }] },
                    { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#0e1626" }] },
                    { "featureType": "water", "elementType": "labels.text.fill", "stylers": [{ "color": "#4e6d70" }] }
                ]
            });

            // ⭐ 唯樂蜜蜂社區地標 (置頂 zIndex: 99999，絕不被覆蓋)
            homeMarker = new google.maps.Marker({
                position: COMMUNITY_COORDS,
                map: map,
                title: "唯樂之丘 (我們社區)",
                zIndex: 99999,
                icon: {
                    url: BEE_ICON_URL,
                    scaledSize: new google.maps.Size(46, 32),
                    anchor: new google.maps.Point(23, 16)
                }
            });

            homeMarker.addListener('mouseover', (e) => {
                showFloatingCard(`
                    <div>
                        <div style="font-weight: 800; color: #fcd34d; font-size: 14px; display: flex; align-items: center; gap: 6px;">
                            <span>🐝</span> 唯樂之丘 (我們社區)
                        </div>
                        <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">桃園市桃園區文中三路18號</div>
                        <div style="font-size: 11px; color: #38bdf8; margin-top: 2px;">中路重劃區生活圈中心</div>
                    </div>
                `, e);
            });

            homeMarker.addListener('mouseout', hideFloatingCard);

            // 渲染所有店家
            renderStores();
        }

        // 零位移浮動卡定位邏輯 (智慧判斷上下左右邊界，純浮動顯示，完全不移地圖)
        function showFloatingCard(html, mouseEvent) {
            floatingCard.innerHTML = html;
            floatingCard.style.display = 'block';

            const cardWidth = 290;
            const cardHeight = floatingCard.offsetHeight || 160;
            const containerRect = mapContainer.getBoundingClientRect();

            let x = mouseEvent.domEvent.clientX - containerRect.left;
            let y = mouseEvent.domEvent.clientY - containerRect.top;

            let left = x + 18;
            let top = y - cardHeight - 12;

            if (top < 15) {
                top = y + 20;
            }

            if (left + cardWidth > containerRect.width - 15) {
                left = x - cardWidth - 18;
            }

            if (left < 15) left = 15;

            floatingCard.style.left = `${left}px`;
            floatingCard.style.top = `${top}px`;
            floatingCard.style.opacity = '1';
        }

        function hideFloatingCard() {
            floatingCard.style.opacity = '0';
            floatingCard.style.display = 'none';
        }

        function checkStoreDiscount(store, discKey) {
            if (discKey !== 'all' && store.status !== 'active') return false;

            if (discKey === 'all') return true;
            if (discKey === '95') return (store.discountPercent > 0 && store.discountPercent <= 95) || store.discountPercent === 0;
            if (discKey === '90') return (store.discountPercent > 0 && store.discountPercent <= 90);
            if (discKey === '88') return store.discountPercent === 88;
            if (discKey === '85') return (store.discountPercent > 0 && store.discountPercent <= 85);
            if (discKey === 'other') return store.discountPercent === 0;
            return false;
        }

        function updateDynamicCounters() {
            const storesInCurrentCat = STORES.filter(s => currentCategory === '全部' || s.category === currentCategory);
            
            document.getElementById('badge-all').innerText = storesInCurrentCat.length;
            document.getElementById('badge-95').innerText = storesInCurrentCat.filter(s => checkStoreDiscount(s, '95')).length;
            document.getElementById('badge-90').innerText = storesInCurrentCat.filter(s => checkStoreDiscount(s, '90')).length;
            document.getElementById('badge-88').innerText = storesInCurrentCat.filter(s => checkStoreDiscount(s, '88')).length;
            document.getElementById('badge-85').innerText = storesInCurrentCat.filter(s => checkStoreDiscount(s, '85')).length;
            document.getElementById('badge-other').innerText = storesInCurrentCat.filter(s => checkStoreDiscount(s, 'other')).length;

            const storesInCurrentDisc = STORES.filter(s => checkStoreDiscount(s, currentDiscount));

            const container = document.getElementById('categoryContainer');
            container.innerHTML = '';

            const allCatBtn = document.createElement('button');
            allCatBtn.id = 'cat-btn-all';
            allCatBtn.className = (currentCategory === '全部')
                ? 'w-full py-2 px-3 rounded-lg text-xs font-bold text-left transition bg-sky-500 text-slate-950 shadow-md flex items-center justify-between'
                : 'w-full py-1.5 px-3 rounded-lg text-xs font-medium text-left transition bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/80 flex items-center justify-between';
            allCatBtn.onclick = () => setCategoryFilter('全部');
            allCatBtn.innerHTML = `<span>✨ 全部分類</span><span class="text-[10px] font-bold opacity-80">${storesInCurrentDisc.length}</span>`;
            container.appendChild(allCatBtn);

            Object.keys(CATEGORY_META).forEach(cat => {
                const matchingStores = storesInCurrentDisc.filter(s => s.category === cat);
                const count = matchingStores.length;
                if (count > 0 || currentCategory === cat) {
                    const meta = CATEGORY_META[cat];
                    const isSelected = (currentCategory === cat);
                    const btn = document.createElement('button');
                    btn.id = `cat-btn-${cat}`;
                    btn.className = isSelected
                        ? 'cat-btn w-full py-2 px-3 rounded-lg text-xs font-bold text-left transition bg-sky-500 text-slate-950 shadow-md flex items-center justify-between'
                        : 'cat-btn w-full py-1.5 px-3 rounded-lg text-xs font-medium text-left transition bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/80 flex items-center justify-between';
                    btn.onclick = () => setCategoryFilter(cat);
                    btn.innerHTML = `<span>${meta.icon} ${cat}</span><span class="text-[10px] text-slate-400 font-bold">${count}</span>`;
                    container.appendChild(btn);
                }
            });
        }

        function getStoreIcon(store) {
            const isInactive = store.status !== 'active';
            const meta = CATEGORY_META[store.category] || { icon: "📍", color: "#64748b" };
            const bgColor = isInactive ? "#64748b" : meta.color;
            const opacity = isInactive ? "0.6" : "1";
            const strokeColor = store.isDisplaced ? "#fef08a" : "#ffffff";
            const strokeWidth = store.isDisplaced ? "2.5" : "2";

            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34" opacity="${opacity}">
                    <rect x="2" y="2" width="30" height="30" rx="10" fill="${bgColor}" stroke="${strokeColor}" stroke-width="${strokeWidth}" filter="drop-shadow(0px 3px 5px rgba(0,0,0,0.5))"/>
                    <text x="17" y="23" font-size="16" text-anchor="middle">${meta.icon}</text>
                </svg>
            `;
            return {
                url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
                scaledSize: new google.maps.Size(34, 34),
                anchor: new google.maps.Point(17, 17)
            };
        }

        function generateInfoContent(store) {
            const isInactive = store.status !== 'active';
            const badgeColor = isInactive ? "background:#334155; color:#cbd5e1; border: 1px solid #475569;" : "background:rgba(245, 158, 11, 0.2); color:#fcd34d; border: 1px solid rgba(245, 158, 11, 0.4);";
            const statusNotice = isInactive ? `
                <div style="background: rgba(136, 19, 55, 0.5); border: 1px solid rgba(244, 63, 94, 0.4); color: #fda4af; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-bottom: 8px;">
                    ⚠️ ${store.statusNote}
                </div>
            ` : '';

            const collisionNotice = store.isDisplaced ? `
                <div style="color: #fde047; font-size: 10px; margin-bottom: 4px;">
                    📍 同址多店家 (已微幅錯開方便點選)
                </div>
            ` : '';

            return `
                <div style="font-family: inherit; color: #f8fafc; font-size: 13px; line-height: 1.45;">
                    ${statusNotice}
                    ${collisionNotice}
                    <div style="display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid rgba(71, 85, 105, 0.7); padding-bottom: 6px; margin-bottom: 8px; gap: 6px;">
                        <span style="font-weight: 700; font-size: 14px; ${isInactive ? 'text-decoration: line-through; color: #94a3b8;' : 'color: #fcd34d;'}">${store.name}</span>
                        <span style="font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; ${badgeColor}">
                            ${store.discountBadge}
                        </span>
                    </div>
                    <div style="color: #e2e8f0; font-size: 12px; margin-bottom: 8px; line-height: 1.5;">
                        ${store.discountDetail}
                    </div>
                    <div style="font-size: 11px; color: #94a3b8; border-top: 1px dashed rgba(71, 85, 105, 0.5); padding-top: 6px; margin-top: 6px; display: flex; flex-direction: column; gap: 3px;">
                        <div>📍 ${store.address}</div>
                        <div>📞 ${store.phone || '無電話紀錄'}</div>
                        <div style="color: #38bdf8;">⏳ 期限：${store.expiry}</div>
                    </div>
                </div>
            `;
        }

        function renderStores() {
            markers.forEach(m => m.setMap(null));
            markers = [];

            const filtered = STORES.filter(store => {
                const matchCat = (currentCategory === '全部' || store.category === currentCategory);
                const matchDisc = checkStoreDiscount(store, currentDiscount);
                return matchCat && matchDisc;
            });

            document.getElementById('storeCountBadge').innerText = `已顯示 ${filtered.length} / 40 家特約`;
            updateDynamicCounters();

            const bounds = new google.maps.LatLngBounds();
            bounds.extend(COMMUNITY_COORDS);

            filtered.forEach(store => {
                const pos = { lat: store.lat, lng: store.lng };
                bounds.extend(pos);

                const marker = new google.maps.Marker({
                    position: pos,
                    map: map,
                    title: store.name,
                    icon: getStoreIcon(store)
                });

                marker.addListener('mouseover', (e) => {
                    showFloatingCard(generateInfoContent(store), e);
                });

                marker.addListener('mouseout', hideFloatingCard);

                markers.push(marker);
            });

            if (filtered.length > 0) {
                const padding = {
                    top: 25,
                    bottom: 25,
                    left: 25,
                    right: 25
                };
                map.fitBounds(bounds, padding);

                const listener = google.maps.event.addListener(map, "idle", function() {
                    if (map.getZoom() > 16) map.setZoom(16);
                    google.maps.event.removeListener(listener);
                });
            } else {
                map.setCenter(COMMUNITY_COORDS);
                map.setZoom(15);
            }
        }

        function setCategoryFilter(cat) {
            currentCategory = cat;
            renderStores();
        }

        function setDiscountFilter(disc) {
            currentDiscount = disc;
            document.querySelectorAll('.disc-btn').forEach(btn => {
                btn.className = 'disc-btn py-2 px-3 rounded-lg text-xs font-medium text-left transition bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80 flex items-center justify-between';
            });
            const activeBtn = document.getElementById(`btn-disc-${disc}`);
            if (activeBtn) {
                activeBtn.className = 'disc-btn py-2 px-3 rounded-lg text-xs font-bold text-left transition bg-amber-500 text-slate-950 shadow-md flex items-center justify-between';
            }
            renderStores();
        }

        function resetMapView() {
            map.panTo(COMMUNITY_COORDS);
            map.setZoom(16);
        }
    </script>

    <!-- 載入 Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDgWTm3DxipzP6aQZW_R_gQsEYyVk4Ad1g&language=zh-TW&region=TW&callback=initMap" async defer></script>
